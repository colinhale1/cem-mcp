version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    # Group dev-dependency bumps into a single PR per week so the review
    # surface stays small. Production deps still come through as individual
    # PRs because they're security-relevant.
    groups:
      dev-dependencies:
        dependency-type: development
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps)"
